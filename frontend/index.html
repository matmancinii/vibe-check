<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Security Auditor</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
    <div class="max-w-5xl mx-auto space-y-8">
        
        <!-- Cabeçalho -->
        <header class="border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-bold text-indigo-400">🛡️ Vibe Security Auditor</h1>
            <p class="text-slate-400 text-sm">Análise de Segurança para projetos desenvolvidos com IA</p>
        </header>

        <!-- Form de entrada da URL -->
        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
            <label class="block text-sm font-medium text-slate-300">URL do Repositório Git:</label>
            <div class="flex gap-4">
                <input id="repoUrl" type="text" placeholder="https://github.com/usuario/projeto.git" 
                       class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
                <button id="btnScan" onclick="executarScan()" 
                        class="bg-indigo-600 hover:bg-indigo-500 font-semibold px-6 py-2 rounded-lg transition-colors">
                    Iniciar Análise
                </button>
            </div>
        </section>

        <div class="flex justify-end">
            <button onclick="baixarRelatorioPDF()" class="bg-emerald-600 hover:bg-emerald-500 font-semibold px-4 py-2 rounded-lg text-sm text-white transition-colors flex items-center gap-2">
                📥 Baixar Relatório PDF
            </button>
        </div>
        <!-- Resultados (Ocultos até o clique) -->
        <div id="resultados" class="hidden space-y-6">
            
            <!-- Cards de Métricas -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                    <p class="text-slate-400 text-xs uppercase font-bold">Vulnerabilidades</p>
                    <p id="metricVulns" class="text-3xl font-bold text-amber-400">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                    <p class="text-slate-400 text-xs uppercase font-bold">Secrets Expostos</p>
                    <p id="metricSecrets" class="text-3xl font-bold text-rose-500">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                    <p class="text-slate-400 text-xs uppercase font-bold">Pacotes Alucinados</p>
                    <p id="metricPackages" class="text-3xl font-bold text-purple-400">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
                    <p class="text-slate-400 text-xs uppercase font-bold">Score de Segurança</p>
                    <p id="metricScore" class="text-3xl font-bold text-emerald-400">0/100</p>
                </div>
            </div>

            <!-- Lista de Achados -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                <h2 class="text-xl font-semibold border-b border-slate-700 pb-2">Resultados da Varredura</h2>
                <div id="listaAchados" class="space-y-3"></div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
